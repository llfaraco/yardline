<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yardline — Seu espaço de fantasy football</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/visual-shell.css">
  <link rel="stylesheet" href="css/player-dossier.css">
  <link rel="stylesheet" href="css/player-profile.css">
</head>
<body>
  <!-- SKIP LINK PARA NAVEGAÇÃO ACESSÍVEL (WCAG 2.1 AA) -->
  <a href="#stage-title" class="skip-link">Pular para o conteúdo principal</a>

  <!-- TOP NFL LIVE SCORE TICKER (ESTILO NFL.COM) -->
  <div class="nfl-live-ticker" id="nfl-live-ticker-strip"></div>

  <!-- YARDLINE APPLICATION HEADER -->
  <header class="yl-topbar">
    <div class="yl-topbar-left">
      <button class="yl-menu-toggle" id="yl-menu-toggle" type="button" aria-label="Abrir navegação" aria-controls="yl-main-navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="yl-wordmark" onclick="openNavTab('home')" aria-label="Yardline, início">
        <img src="assets/yardline-logo.png" alt="Yardline" width="420" height="71">
      </button>
      <span class="yl-sport-label">FANTASY FOOTBALL</span>
    </div>
    <div class="yl-search-center" role="search">
      <div class="yl-search-field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input type="search" id="global-omni-search" aria-label="Buscar jogadores" placeholder="Buscar um jogador..." oninput="handleGlobalSearch(this.value)" />
        <kbd aria-hidden="true">/</kbd>
      </div>
    </div>
    <div class="yl-topbar-right">
      <button class="yl-header-chat" id="topbar-chat-toggle" onclick="toggleLeagueChat()" aria-label="Abrir ou recolher chat da liga">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-5 3V6a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3z"/></svg>
        <span>Chat da liga</span>
      </button>
      <span class="yl-header-divider" aria-hidden="true"></span>
      <button class="yl-profile-button" id="topbar-user-pill" onclick="openOnboardingModal(2)" title="Selecionar usuário Sleeper">
        <span class="yl-avatar" aria-hidden="true">YL</span><span>Minha conta</span>
      </button>
    </div>
  </header>

  <!-- 3-COL SHELL -->
  <div class="yl-main-shell">
    <button class="yl-nav-backdrop" id="yl-nav-backdrop" aria-label="Fechar navegação" hidden></button>
    <aside class="yl-icon-rail yl-fp-sidebar" id="yl-main-navigation" aria-label="Navegação principal">
      <div class="yl-sidebar-league" role="button" tabindex="0" onclick="openLeagueSwitcherModal()" style="cursor:pointer;" title="Clique para alternar de liga ou time">
        <div class="yl-sidebar-league__logo" id="sidebar-league-logo">YL</div>
        <div class="yl-sidebar-league__copy" id="sidebar-league-copy"><b>Seu espaço de jogo</b><span>Selecionar liga Sleeper</span></div>
        <span class="yl-sidebar-chevron">⌄</span>
      </div>
      <div class="yl-sidebar-select"><span>Fantasy Football</span><b>NFL</b></div>
      <div class="yl-sidebar-select" role="button" tabindex="0" onclick="openLeagueSwitcherModal()" style="cursor:pointer;"><span id="sidebar-team-label">Selecionar meu time</span><b>⌄</b></div>
      <nav class="yl-sidebar-nav" aria-label="Ferramentas Yardline">
        <button class="yl-sidebar-section" onclick="toggleSidebarGroup('lineup')"><b>Meu time</b><span data-chevron="lineup">⌃</span></button>
        <div class="yl-sidebar-group open" data-sidebar-group="lineup">
          <button class="fp-rail-item active" data-tab="home" onclick="openNavTab('home')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Visão geral</span>
          </button>
          <button class="fp-rail-item" data-tab="playbook" onclick="openNavTab('playbook')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
            <span>Meu Playbook</span>
          </button>
          <button class="fp-rail-item" data-tab="league" onclick="openNavTab('league')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            <span>Confronto da Semana</span>
          </button>
        </div>
        <button class="yl-sidebar-section" onclick="toggleSidebarGroup('waiver')"><b>Mercado</b><span data-chevron="waiver">⌃</span></button>
        <div class="yl-sidebar-group open" data-sidebar-group="waiver">
          <button class="fp-rail-item" data-tab="waivers" onclick="openNavTab('waivers')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>Waivers & FAAB</span>
          </button>
        </div>
        <button class="yl-sidebar-section" onclick="toggleSidebarGroup('trade')"><b>Trocas</b><span data-chevron="trade">⌃</span></button>
        <div class="yl-sidebar-group open" data-sidebar-group="trade">
          <button class="fp-rail-item" data-tab="trade" onclick="openNavTab('trade')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            <span>Trade Analyzer</span>
          </button>
        </div>
        <button class="yl-sidebar-section" onclick="toggleSidebarGroup('research')"><b>Explorar NFL</b><span data-chevron="research">⌃</span></button>
        <div class="yl-sidebar-group open" data-sidebar-group="research">
          <button class="fp-rail-item" data-tab="home" onclick="openNavTab('home')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
            <span>Notícias NFL</span>
          </button>
          <button class="fp-rail-item" data-tab="players" onclick="openNavTab('players')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v3"/></svg>
            <span>Jogadores</span>
          </button>
          <button class="fp-rail-item" data-tab="teams" onclick="openNavTab('teams')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span>Elencos NFL</span>
          </button>
          <button class="fp-rail-item" data-tab="rankings" onclick="openNavTab('rankings')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span>Rankings</span>
          </button>
        </div>
        <button class="yl-sidebar-section" onclick="toggleSidebarGroup('tools')"><b>Ferramentas</b><span data-chevron="tools">⌄</span></button>
        <div class="yl-sidebar-group" data-sidebar-group="tools">
          <button class="fp-rail-item" data-tab="manager-dna" onclick="openNavTab('manager-dna')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>Manager DNA</span>
          </button>
          <button class="fp-rail-item" data-tab="aimode" onclick="openNavTab('aimode')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
            <span>Modo IA</span>
          </button>
          <button class="fp-rail-item" data-tab="social" onclick="openNavTab('social')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <span>Veredito</span>
          </button>
          <button class="fp-rail-item" data-tab="plans" onclick="openNavTab('plans')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            <span>Planos</span>
          </button>
        </div>
      </nav>
      <div class="yl-sidebar-footer"><span class="yl-footer-mark">YARDLINE</span><p>Seu jogo. Sua estratégia.</p></div>
    </aside>

    <main class="yl-stage-container">
      <div class="yl-subnav-strip">
        <div class="yl-page-heading">
          <span class="yl-eyebrow">SEU CENTRO DE FANTASY</span>
          <h1 id="stage-title" tabindex="-1">Visão geral</h1>
          <p id="stage-subtitle">Acompanhe a NFL. Encontre seu próximo movimento.</p>
        </div>
        <button class="btn-yl btn-primary yl-connect-button" onclick="openOnboardingModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m10 13 4-4M8 16l-2 2a4 4 0 0 1-6-6l4-4m12 0 2-2a4 4 0 0 1 6 6l-4 4" transform="translate(1 0) scale(.9)"/></svg>
          Conectar liga
        </button>
      </div>

      <section id="view-home" class="view-section active"></section>
      <section id="view-teams" class="view-section"></section>
      <section id="view-players" class="view-section"></section>
      <section id="view-playbook" class="view-section"></section>
      <section id="view-trade" class="view-section"></section>
      <section id="view-league" class="view-section"></section>
      <section id="view-waivers" class="view-section"></section>
      <section id="view-rankings" class="view-section"></section>
<section id="view-manager-dna" class="view-section"></section>
      <section id="view-aimode" class="view-section"></section>
      <section id="view-social" class="view-section"></section>
      <section id="view-plans" class="view-section"></section>
    </main>

    <!-- RIGHT COLUMN: PERSISTENT LEAGUE CHAT (PILLAR 3) -->
    <aside class="yl-chat-rail" id="yl-chat-rail">
      <div class="yl-chat-header">
        <div class="yl-chat-header__title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span>League Chat</span>
          <span class="badge badge-navy" style="font-size:9.5px;padding:2px 6px;">Neilo Pistola</span>
        </div>
        <div class="yl-chat-header__actions">
          <button class="btn-yl btn-outline" style="padding:4px 6px;display:flex;align-items:center;justify-content:center;" onclick="toggleLeagueChat()" title="Recolher League Chat"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
      </div>
      <div class="yl-chat-feed" id="yl-chat-feed">
        <!-- Rendered by renderLeagueChatFeed() -->
      </div>
      <div class="yl-chat-composer">
        <form id="yl-chat-form" onsubmit="event.preventDefault();sendChatMessage();" style="display:flex;gap:6px;width:100%;">
          <input type="text" id="yl-chat-input" placeholder="Enter Message..." autocomplete="off" />
          <button type="submit" class="btn-yl btn-primary" style="padding:0 12px;font-size:12px;">Enviar</button>
        </form>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--text-muted);padding:0 2px;">
          <span style="display:flex;gap:6px;">
            <button type="button" class="btn-yl btn-outline" style="padding:2px 7px;font-size:9.5px;" onclick="insertChatQuickText('Boa sorte na rodada!')">Sorte</button>
            <button type="button" class="btn-yl btn-outline" style="padding:2px 7px;font-size:9.5px;" onclick="insertChatQuickText('Alguém aberto para trades de IDP?')">Trade</button>
            <button type="button" class="btn-yl btn-outline" style="padding:2px 7px;font-size:9.5px;" onclick="insertChatQuickText('Purdy e Kittle vão pontuar alto!')">Destaques</button>
          </span>
          <span style="font-weight:600;color:var(--yl-navy);">@Faraco</span>
        </div>
      </div>
    </aside>
  </div>

  <div class="yl-modal-overlay" id="article-reader-modal" role="dialog" aria-modal="true" aria-label="Visualizador de Artigo e Notícia NFL" onclick="if(event.target===this)closeModal('article-reader-modal')"><div class="yl-modal-card" id="article-modal-content"></div></div>
  <div class="yl-modal-overlay" id="player-modal" role="dialog" aria-modal="true" aria-label="Dossiê Canônico do Atleta" onclick="if(event.target===this)closeModal('player-modal')"><div class="yl-modal-card" id="player-modal-content"></div></div>

  <!-- ONBOARDING MODAL (4 PASSOS) -->
  <div class="yl-modal-overlay" id="onboarding-modal" role="dialog" aria-modal="true" aria-label="Assistente de Configuração e Boas-Vindas" onclick="if(event.target===this)closeModal('onboarding-modal')">
    <div class="yl-modal-card" id="onboarding-modal-content" style="max-width:760px;padding:28px 32px;">
      <!-- Content rendered by renderOnboardingStep() -->
    </div>
  </div>

  <!-- WAIVER & FAAB SMART MODAL (8 PASSOS) -->
  <!-- LINEUP SWAP MODAL (SUBSTITUIÇÃO GUIADA COM VALIDAÇÃO POSICIONAL) -->
  <div class="yl-modal-overlay" id="lineup-swap-modal" role="dialog" aria-modal="true" aria-label="Substituição Guiada de Escalação" onclick="if(event.target===this)closeModal('lineup-swap-modal')">
    <div class="yl-modal-card" id="lineup-swap-modal-content" style="max-width:680px;padding:26px 30px;">
      <!-- Content rendered by openLineupSwapModal() -->
    </div>
  </div>

  <div class="yl-modal-overlay" id="waiver-modal" role="dialog" aria-modal="true" aria-label="Reivindicação e Análise de Waiver FAAB" onclick="if(event.target===this)closeModal('waiver-modal')">
    <div class="yl-modal-card" id="waiver-modal-content" style="max-width:720px;padding:28px 32px;">
      <!-- Content rendered by openSmartWaiverClaimModal() -->
    </div>
  </div>

  <!-- CHECKOUT & PIX MODAL (PLANO MESTRE SEÇÃO 11) -->
  <div class="yl-modal-overlay" id="checkout-modal" role="dialog" aria-modal="true" aria-label="Checkout Seguro de Assinatura YARDLINE" onclick="if(event.target===this)closeModal('checkout-modal')">
    <div class="yl-modal-card" id="checkout-modal-content" style="max-width:520px;padding:26px 28px;">
      <!-- Content rendered by openCheckoutModal() -->
    </div>
  </div>

  <!-- MANAGER DNA INDIVIDUAL SCOUTING MODAL -->
  <div class="yl-modal-overlay" id="manager-dna-modal" role="dialog" aria-modal="true" aria-label="Perfil Tático Manager DNA" onclick="if(event.target===this)closeModal('manager-dna-modal')">
    <div class="yl-modal-card" id="manager-dna-modal-content" style="max-width:680px;padding:26px 30px;">
      <!-- Content rendered by openManagerDnaDetailModal() -->
    </div>
  </div>

  <!-- START/SIT ASSISTANT & COMPARADOR DE JOGADORES (FANTASYPROS PARITY) -->
  <div class="yl-modal-overlay" id="start-sit-modal" role="dialog" aria-modal="true" aria-label="Assistente Start/Sit e Comparador de Jogadores" onclick="if(event.target===this)closeModal('start-sit-modal')">
    <div class="yl-modal-card" id="start-sit-modal-content" style="max-width:780px;padding:26px 30px;">
      <!-- Content rendered by openStartSitModal() -->
    </div>
  </div>

  <!-- LEAGUE & TEAM SWITCHER MODAL -->
  <div class="yl-modal-overlay" id="league-switcher-modal" role="dialog" aria-modal="true" aria-label="Alternar Liga e Elenco Sleeper" onclick="if(event.target===this)closeModal('league-switcher-modal')">
    <div class="yl-modal-card" id="league-switcher-modal-content" style="max-width:640px;padding:26px 30px;">
      <!-- Content rendered by openLeagueSwitcherModal() -->
    </div>
  </div>

  <div id="yl-toast-banner" style="display:none;position:fixed;bottom:20px;right:20px;background:#0F172A;color:#FFF;padding:12px 18px;border-radius:8px;border-left:4px solid #C3112B;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,0.25);z-index:9999;"></div>

  <script src="js/player-card-contract.js?v=20261016_merge"></script>
  <script src="js/data_and_views.js?v=20261016_2130"></script>
  <script src="js/player-dossier-presentation.js"></script>
  <script src="js/engines.js?v=20261016_2126"></script>
  <script src="js/visual-shell.js"></script>
  <script src="js/league-experience.js"></script>
  <script src="js/league-auto-refresh.js"></script>
</body>
</html>
