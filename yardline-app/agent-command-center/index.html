<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YARDLINE — Agent Command Center</title>
  <link rel="stylesheet" href="css/command-center.css" />
</head>
<body>
  <div class="cc-app-shell">
    <!-- LEFT NAVIGATION RAIL -->
    <aside class="cc-sidebar">
      <div class="cc-sidebar-header">
        <div class="cc-logo-icon">YL</div>
        <div>
          <strong style="font-size:13.5px;color:#fff;display:block;">COMMAND CENTER</strong>
          <span style="font-size:10.5px;color:var(--cc-text-dim);">Governança & QA Autônomo</span>
        </div>
      </div>

      <nav class="cc-sidebar-nav">
        <button class="cc-nav-item active" data-tab="dashboard" onclick="window.ccStore.setTab('dashboard')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Dashboard Geral</span>
        </button>

        <button class="cc-nav-item" data-tab="agents" onclick="window.ccStore.setTab('agents')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Agentes (15 Papéis)</span>
          <span class="cc-nav-badge">15</span>
        </button>

        <button class="cc-nav-item" data-tab="qa" onclick="window.ccStore.setTab('qa')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>QA & Testes E2E</span>
          <span class="cc-nav-badge" style="background:rgba(16, 185, 129, 0.15);color:#34d399;">VETO</span>
        </button>

        <button class="cc-nav-item" data-tab="bugs" onclick="window.ccStore.setTab('bugs')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2l4 4-4 4"></path><path d="M12 6H2"></path><path d="M16 22l-4-4 4-4"></path><path d="M12 18h10"></path></svg>
          <span>Bugs & Bloqueios</span>
        </button>

        <button class="cc-nav-item" data-tab="references" onclick="window.ccStore.setTab('references')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span>Referências Externas</span>
          <span class="cc-nav-badge">4</span>
        </button>

        <button class="cc-nav-item" data-tab="activity" onclick="window.ccStore.setTab('activity')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          <span>Atividade dos Agentes</span>
        </button>

        <button class="cc-nav-item" data-tab="contracts" onclick="window.ccStore.setTab('contracts')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Contratos & DTOs</span>
          <span class="cc-nav-badge">11</span>
        </button>

        <button class="cc-nav-item" data-tab="release" onclick="window.ccStore.setTab('release')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span>Releases & Saúde</span>
        </button>
      </nav>

      <div style="padding:14px;border-top:1px solid var(--cc-border-subtle);">
        <a href="/" class="btn-cc btn-cc-outline" style="width:100%;text-decoration:none;">
          ← Voltar para o Fantasy
        </a>
      </div>
    </aside>

    <!-- MAIN OPERATIONAL STAGE -->
    <main class="cc-main-container">
      <header class="cc-topbar">
        <div class="cc-topbar-left">
          <span class="badge badge-purple">TEAM LEADER AUTÔNOMO</span>
          <span style="font-size:12px;color:var(--cc-text-muted);">Sincronização contínua a cada 10 min · Branch <code>feature/agent-command-center</code></span>
        </div>
        <div class="cc-topbar-right">
          <button class="btn-cc btn-cc-primary" onclick="window.ccStore.triggerSync().then(() => alert('Telemetria atualizada com sucesso!'))">
            ↻ Sincronizar Agora
          </button>
        </div>
      </header>

      <div class="cc-content" id="cc-view-container">
        <!-- Rendered dynamically by cc-views.js -->
      </div>
    </main>
  </div>

  <!-- MODAL OVERLAY -->
  <div class="cc-modal-overlay" id="cc-modal-overlay" onclick="if(event.target===this)window.ccStore.closeModal()">
    <div class="cc-modal" id="cc-modal-container">
      <!-- Modal Content rendered dynamically -->
    </div>
  </div>

  <script src="js/cc-store.js"></script>
  <script src="js/cc-views.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      window.ccStore.subscribe(() => window.renderCommandCenter());
      await window.ccStore.fetchAll();
      window.renderCommandCenter();

      // Fechar modal ao pressionar Escape
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.ccStore.closeModal();
        }
      });
    });
  </script>
</body>
</html>
